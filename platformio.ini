; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino, espidf
monitor_speed = 115200
; microlink needs the room; min_spiffs keeps both OTA slots.
board_build.partitions = min_spiffs.csv

build_flags =
    ; AsyncTCP defaults to "any core", which lets the HTTP/WebSocket task land
    ; on core 1 and compete with RTCM forwarding. Core 0 already hosts the
    ; network task; core 1 stays reserved for the GNSS serial path.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0

; Bağımlılıklar (Libraries)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    mikalhart/TinyGPSPlus @ ^1.0.3